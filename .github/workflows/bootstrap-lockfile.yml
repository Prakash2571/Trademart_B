name: Bootstrap lockfile

# ONE-TIME BOOTSTRAP. Delete this workflow once package-lock.json is committed.
#
# Why it exists: `npm ci` requires a committed package-lock.json, but the
# environment this repository was authored in has no route to the npm registry,
# so `npm install --package-lock-only` cannot be run there. A GitHub runner does
# have registry access, so the lockfile is generated HERE, from the real
# registry, and committed back.
#
# It is NOT a fabricated lockfile: npm resolves the real dependency tree and
# writes real integrity hashes. The job then proves the result by running
# `npm ci` against it, plus typecheck/test/build, so a lockfile that does not
# actually work cannot be committed.
#
# Triggered by pushing this dedicated bootstrap branch, and manually. The commit
# it makes carries [skip ci], which GitHub honours, so pushing the lockfile
# cannot re-trigger this job in a loop.

on:
  push:
    branches: [chore/bootstrap-lockfile]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: generate, verify and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report starting state
        run: |
          echo "node:  $(node -v)"
          echo "npm:   $(npm -v)"
          if [ -f package-lock.json ]; then
            echo "A lockfile is already committed; it will be refreshed from package.json."
          else
            echo "No lockfile committed yet."
          fi

      # --package-lock-only resolves the full tree and writes the lockfile
      # WITHOUT installing, which is faster and cannot be influenced by a
      # partially-populated node_modules.
      - name: Generate the lockfile from the real registry
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Sanity-check what was produced
        run: |
          test -f package-lock.json || { echo "::error::npm produced no package-lock.json"; exit 1; }
          VERSION=$(node -p "require('./package-lock.json').lockfileVersion")
          PACKAGES=$(node -p "Object.keys(require('./package-lock.json').packages||{}).length")
          echo "lockfileVersion=$VERSION packages=$PACKAGES"
          # lockfileVersion 1 has no integrity hashes for the full tree.
          if [ "$VERSION" -lt 2 ]; then
            echo "::error::lockfileVersion $VERSION lacks full-tree integrity"; exit 1
          fi
          # A tree this small would mean resolution silently failed.
          if [ "$PACKAGES" -lt 20 ]; then
            echo "::error::only $PACKAGES packages resolved - that is implausible"; exit 1
          fi
          # Every third-party entry must carry an integrity hash. This is the
          # check that distinguishes a real lockfile from a hand-written one.
          node -e '
            const lock = require("./package-lock.json");
            const missing = Object.entries(lock.packages || {})
              .filter(([p, m]) => p.startsWith("node_modules/") && !m.link && !m.integrity)
              .map(([p]) => p);
            if (missing.length) {
              console.error("::error::entries without integrity: " + missing.join(", "));
              process.exit(1);
            }
            console.log("all " + Object.keys(lock.packages).length + " entries carry integrity hashes");
          '

      # The lockfile is only worth committing if it actually installs and the
      # project actually builds from it.
      - name: Prove `npm ci` works from the generated lockfile
        run: npm ci

      - name: Prove the project builds from it
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit the lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed and unchanged; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit \
            -m "chore: commit real package-lock.json for reproducible builds [skip ci]" \
            -m "Generated by .github/workflows/bootstrap-lockfile.yml on a GitHub runner, because the authoring environment has no route to the npm registry." \
            -m "npm resolved the real dependency tree and wrote real integrity hashes. The same job then proved the result with npm ci plus typecheck/build before committing it, so nothing here is hand-written." \
            -m "With this in place, CI and the Dockerfile require npm ci unconditionally and the lockfile-generation workaround is removed."
          git push origin HEAD:${{ github.ref_name }}
          echo "Pushed lockfile to ${{ github.ref_name }}"
