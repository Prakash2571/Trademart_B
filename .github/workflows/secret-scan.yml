name: Secret scan

# This repository holds the credentials that matter most: the Shopify Admin token, the
# webhook signing secret, the Mongo URI, the operator session secret and the token
# encryption key. Nothing checked for an accidentally committed one.
#
# CALIBRATION MATTERS MORE THAN COVERAGE
# -------------------------------------
# The patterns below match credential SHAPES, not the words "token" or "secret". An
# earlier draft matched the words and produced seven hits in this repo - every one of them
# a legitimate .env.example placeholder, a documentation example, or the redaction test
# fixture in shopify.errors.test.ts. A check that cries wolf is one people learn to
# ignore, which is worse than no check at all.
#
# So: Shopify rules require 32+ characters after the prefix (a real token's length, so the
# short test fixture does not match), the Mongo rule excludes angle brackets so
# <user>:<password> templates do not match, and a placeholder filter drops the rest.
#
# Verified both ways before being committed: zero hits across all three Trademart repos,
# and all five planted credential shapes detected.
#
# This job deliberately does NOT scan for the WORD "secret". src/ is full of legitimate
# uses - webhookSecret, sessionSecret, assertTrackingSecret - and flagging them would
# train everyone to ignore this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-secrets:
    name: no credentials in source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan for credential-shaped literals
        run: |
          set -uo pipefail
          PATTERNS='shpat_[A-Za-z0-9]{32,}'
          PATTERNS="$PATTERNS|shpca_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|shpss_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|rzp_live_[A-Za-z0-9]{10,}"
          PATTERNS="$PATTERNS|sk_live_[A-Za-z0-9]{16,}"
          PATTERNS="$PATTERNS|mongodb(\+srv)?://[^:@/[:space:]<>]+:[^@[:space:]<>]+@"

          # Credentials that legitimately appear in templates, docs and test fixtures.
          PLACEHOLDER='user:pass@|user:password@|username:password@|<user>|<password>|changeme|placeholder|example\.com|YOUR_|xxxx|redacted'

          HITS=$(grep -rInE "$PATTERNS" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=dist-test \
            --exclude=package-lock.json \
            --exclude=secret-scan.yml 2>/dev/null | grep -viE "$PLACEHOLDER" || true)

          if [ -n "$HITS" ]; then
            echo "::error title=Credential in source::A credential-shaped literal is committed. ROTATE IT FIRST, then remove it - git history keeps the old value, so deleting the line is not enough."
            echo "$HITS"
            exit 1
          fi
          echo "no credential-shaped literals found"

      - name: Assert no .env file is tracked
        run: |
          set -uo pipefail
          # .env.example and deploy/.env.example are the committed templates and are
          # expected. A real .env is not.
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error title=.env committed::A .env file is tracked. Only .env.example belongs in the repository."
            echo "$TRACKED"
            exit 1
          fi
          echo "no tracked .env files"

      # NOTE: there is deliberately NO "backend must not mention NEXT_PUBLIC_" check.
      # It was drafted and then removed after testing against the real tree:
      # deployment.env.test.ts legitimately asserts that Compose documents
      # NEXT_PUBLIC_API_BASE_URL, because deploy/docker-compose.yml builds the frontend
      # from this repo. The check would have failed on correct code, which is the same
      # calibration mistake described in the header.

      # The encryption key exists so offline Shopify tokens are never at rest in
      # plaintext. A code path that writes one unencrypted would defeat it silently.
      - name: Assert offline tokens are only stored encrypted
        run: |
          set -uo pipefail
          # The Store model must not carry a plaintext token field.
          if grep -rInE '\b(offlineToken|accessToken|adminToken)\s*:\s*\{?\s*type:\s*String' src/database/models/ 2>/dev/null | grep -viE 'encrypted' ; then
            echo "::error title=Plaintext token field::A model declares a token field that is not named as encrypted. Offline Shopify tokens must only be persisted encrypted."
            exit 1
          fi
          echo "no plaintext token fields in models"
