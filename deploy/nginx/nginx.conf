# Trademart - main nginx configuration.
#
# Replaces the image default so the http{} context is fully under our control
# (the stock file already sets sendfile/keepalive, and re-declaring a flag
# directive in the same context is a hard config error).
#
# Server blocks live in conf.d/, rendered from templates/ at container start
# with ${DOMAIN} substituted by the official entrypoint's envsubst step.

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $http_x_forwarded_for is logged too, so a chained CDN/LB is visible.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" xff="$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    types_hash_max_size 2048;

    # The Shopify webhook route reads the raw body with a 2mb limit; leave
    # headroom so nginx is never the thing that rejects a valid delivery.
    client_max_body_size   4m;
    client_body_timeout    30s;
    client_header_timeout  30s;

    # Default upstream timeouts, inherited by every proxied location. The /api
    # location overrides send/read to 120s for slow Shopify GraphQL calls.
    # Declared here (not in snippets/proxy.conf) so a location can override them
    # without producing a duplicate-directive error.
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ---- Upstream name resolution -------------------------------------------
    # Docker's embedded DNS server. Combined with a variable in proxy_pass (see
    # templates/default.conf.template) this makes nginx re-resolve `backend` and
    # `frontend` at request time. Without it nginx resolves once at startup and
    # keeps hammering a dead IP after a container is recreated with a new one.
    #
    # Podman/rootless users: the embedded DNS may not be at 127.0.0.11. Check
    # /etc/resolv.conf inside the container and adjust.
    resolver       127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- WebSocket / streaming upgrade --------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- TLS (Mozilla "intermediate", declared once for all server blocks) ---
    ssl_session_timeout  1d;
    ssl_session_cache    shared:TrademartSSL:10m;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ---- Compression ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/x-javascript
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/conf.d/*.conf;
}
