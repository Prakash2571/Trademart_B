# Response headers added at the edge.
#
# Repeated in every location that declares its own add_header, because nginx
# does NOT inherit add_header from an outer block once the inner block sets one.
#
# Content-Security-Policy is deliberately absent: Next.js needs a nonce/hash
# strategy to avoid breaking its inline hydration script, which is an
# application-side change rather than an nginx one.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"                            always;
add_header X-Frame-Options           "SAMEORIGIN"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
