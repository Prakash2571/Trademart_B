# Standard reverse-proxy headers.
#
# The Express app runs with `app.set('trust proxy', 1)` - it trusts EXACTLY one
# hop. $proxy_add_x_forwarded_for appends the real client IP here, so
# express-rate-limit and the request logs see the visitor rather than the
# container's gateway address.
#
# If you ever put another proxy in front of this nginx (Cloudflare, an ALB),
# raise that number in src/app.ts to match the number of hops or rate limiting
# will bucket every visitor together.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Do not rewrite upstream redirects; Next.js and Express already emit correct
# absolute paths for the public origin.
proxy_redirect off;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
