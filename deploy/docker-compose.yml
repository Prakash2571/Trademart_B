# Trademart - single-host production stack.
#
#   cd Trademart_B/deploy
#   cp .env.example .env    # then fill it in
#   ./start.sh              # builds, boots, and issues TLS certs
#
# The database is EXTERNAL by default - set MONGODB_URI to your Atlas (or other)
# connection string and nothing here touches a Mongo image. To run Mongo inside
# the stack instead, add this line to .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local-db.yml
#
# Expects both repos cloned side by side:
#
#   <parent>/
#     ├── Trademart_B/deploy/docker-compose.yml   <- you are here
#     └── Trademart_F/
#
# Override FRONTEND_CONTEXT in .env if the frontend lives somewhere else.
#
# Only nginx publishes ports. backend and frontend are reachable solely on the
# internal `trademart` network. The database is external by default (Atlas);
# the local-db overlay adds an internal-only `mongo` service.

name: trademart

# Shared by every service:
#  - restart: unless-stopped -> restarts on crash AND on host boot, but a
#    deliberate `docker compose stop` stays stopped.
#  - capped json-file logs -> an unbounded log is the most common way a
#    "never stops" stack actually dies (full disk).
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ------------------------------------------------------------- backend ------
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        # Baked into the image and surfaced by GET /api/version, so a running
        # container can be tied back to a commit. Without this a locally built
        # `:latest` is indistinguishable from any other `:latest`.
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    # Tag with the git SHA as well as IMAGE_TAG when you can - a rollback needs a
    # previous image that still exists. See docs/DEPLOYMENT.md.
    image: trademart-backend:${IMAGE_TAG:-latest}
    <<: *defaults
    environment:
      NODE_ENV: production
      PORT: "4000"

      # Sole CORS origin accepted by the API. Must match the public origin
      # exactly, no trailing slash.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in deploy/.env}

      # Required when NODE_ENV=production - the process exits 1 without it.
      # Point this at MongoDB Atlas (mongodb+srv://...) or any external server.
      # To run Mongo inside the stack instead, see docker-compose.local-db.yml.
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in deploy/.env}

      # This backend's own PUBLIC origin, as Shopify reaches it. Distinct from
      # FRONTEND_URL (the browser app). Required for the OAuth redirect flow and
      # for registering webhooks - Shopify cannot reach an internal service name.
      # Normally https://<your DOMAIN>; left blank disables both features.
      APP_URL: ${APP_URL:-}

      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:?set SHOPIFY_STORE_DOMAIN in deploy/.env}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-07}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}

      # Scopes requested by the OAuth redirect flow. Ignored under Shopify-managed
      # installation, where shopify.app.toml is the source of truth.
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-}

      # auto (default) = client credentials grant, unchanged.
      # oauth          = use the stored per-merchant offline token; requires
      #                  APP_URL and TOKEN_ENCRYPTION_KEY.
      SHOPIFY_AUTH_MODE: ${SHOPIFY_AUTH_MODE:-auto}

      # AES-256-GCM key for offline tokens at rest. Only required when
      # SHOPIFY_AUTH_MODE=oauth. Changing it invalidates every stored token.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}

      # ---- Storefront automation kill switches ----------------------------
      # Both default to false, so deploying this cannot change a live store.
      # Must be exactly "true" or "false" - the backend exits 1 on anything else
      # rather than silently guessing, which in Docker looks like a crash loop.
      # Check `make logs-backend` if the container will not start.
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-false}
      AUTOMATION_ON_WEBHOOK: ${AUTOMATION_ON_WEBHOOK:-false}

      # ---- Store safety ----------------------------------------------------
      # Declares whether this points at a development store or a real one.
      # Defaults to `production`, so an undeclared store is assumed real.
      # Verified against Shopify's own plan.partnerDevelopment - see
      # GET /api/diagnostics/store-mode.
      SHOPIFY_STORE_MODE: ${SHOPIFY_STORE_MODE:-production}
      # Lets AUTOMATED tooling (tests, seed and smoke scripts) write to a
      # non-development store. Default false. Does NOT affect a signed-in
      # operator running their own shop.
      ALLOW_LIVE_STORE_WRITES: ${ALLOW_LIVE_STORE_WRITES:-false}
      # Optional pin for the Online Store sales channel; normally discovered.
      SHOPIFY_ONLINE_STORE_PUBLICATION_ID: ${SHOPIFY_ONLINE_STORE_PUBLICATION_ID:-}
      # Server-side cap on a single stock change. Larger needs confirmLargeChange.
      MAX_INVENTORY_DELTA: ${MAX_INVENTORY_DELTA:-500}

      # ---- Retention (enforced by MongoDB TTL indexes) ---------------------
      RETENTION_WEBHOOK_EVENT_DAYS: ${RETENTION_WEBHOOK_EVENT_DAYS:-45}
      RETENTION_IDEMPOTENCY_HOURS: ${RETENTION_IDEMPOTENCY_HOURS:-48}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-730}
      AUTOMATION_PREVIEW_TTL_MINUTES: ${AUTOMATION_PREVIEW_TTL_MINUTES:-15}

      # ---- Operator authentication ----------------------------------------
      # Protects every write endpoint. Fails closed: with none of these set,
      # management endpoints refuse with UNAUTHORIZED rather than being open.
      # Generate: npm run operator:hash / openssl rand -base64 48.
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      OPERATOR_PROTECT_READS: ${OPERATOR_PROTECT_READS:-false}
    # No depends_on: the database is external by default. The local-db override
    # adds a depends_on for the bundled Mongo when you opt into it.
    expose:
      - "4000"
    networks: [trademart]
    # ---- Container hardening -----------------------------------------------
    # read_only root filesystem: the app writes nothing to disk (logs go to
    # stdout, state goes to Mongo), so this costs nothing and removes a whole
    # class of post-compromise persistence.
    read_only: true
    # /tmp is the one writable path Node may need (e.g. for a V8 scratch file).
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      # Blocks setuid escalation inside the container.
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image already runs as `node`; stated explicitly so a base-image change
    # cannot silently promote this to root.
    user: node
    # Bounded so one runaway request cannot starve nginx or Mongo on a small host.
    # Raise `limits` if a large catalogue scan is ever OOM-killed.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      # LIVENESS. /api/health/ready would fail when Mongo is unreachable, and a
      # restart cannot fix a database that lives elsewhere - that turns a blip
      # into a crash loop. Poll /api/health/ready separately to route traffic.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ------------------------------------------------------------ frontend ------
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../Trademart_F}
      dockerfile: Dockerfile
      target: runtime
      args:
        # Inlined into the browser bundle at build time. Rebuild the image
        # (./start.sh or `docker compose build frontend`) after changing it.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: trademart-frontend:${IMAGE_TAG:-latest}
    <<: *defaults
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks: [trademart]
    read_only: true
    tmpfs:
      # Next.js writes its cache under .next/cache at runtime, so that path has to
      # be writable even though the rest of the filesystem is not.
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: node
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # --------------------------------------------------------------- nginx ------
  nginx:
    image: nginx:1.27-alpine
    <<: *defaults
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      # Substitute ONLY ${DOMAIN} in the templates. Without this filter envsubst
      # would also eat nginx runtime variables such as $host and $request_uri.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    # nginx is NOT read_only: it writes its pid file and proxy temp files. Dropping
    # privileges is still worthwhile, and it needs NET_BIND_SERVICE to bind :80.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192M
    # service_started, not service_healthy: nginx must come up even when the
    # backend is crash-looping, otherwise a bad env var takes the whole site
    # offline instead of just the /api routes. Upstreams are re-resolved via
    # Docker's DNS at request time (see nginx/nginx.conf).
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      # Internal-only listener on 8080, never published.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Reload every 6h so renewed certificates are picked up without downtime.
    #
    # Deliberately plain POSIX sh: this image's /bin/sh is busybox ash, where
    # `wait ${!}` is a "Bad substitution" syntax error that kills the whole
    # script before nginx ever starts. A bare `sleep` needs no job-control
    # plumbing because nginx, not this shell, is the process handling signals.
    command:
      - /bin/sh
      - -c
      - |
        while :; do sleep 6h; nginx -s reload; done &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    networks: [trademart]

  # -------------------------------------------------------------- certbot -----
  # Long-running renewal loop. Certificate ISSUANCE is done once by ./start.sh
  # (which overrides the entrypoint); this service only renews.
  certbot:
    image: certbot/certbot:latest
    <<: *defaults
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt_lib:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done
    networks: [trademart]

  # -------------------------------------------------------------- autoheal ----
  # Opt-in: `docker compose --profile autoheal up -d`.
  # Docker restarts containers that EXIT, but not containers that are merely
  # reported unhealthy. This watches healthchecks and restarts the unhealthy.
  # It needs the Docker socket, so enable it only if you accept that trade-off.
  autoheal:
    image: willfarrell/autoheal:latest
    profiles: [autoheal]
    <<: *defaults
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [trademart]

volumes:
  letsencrypt:
  letsencrypt_lib:
  certbot_www:
  nginx_logs:

networks:
  trademart:
    driver: bridge
